<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>LM Studio Mobile Chat · LAN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #1e1e1e;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* header + collapsible settings */
        .toolbar {
            background: #1e2b3c;
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 1px solid #2c3e50;
        }

        .toolbar h1 {
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .settings-toggle {
            background: #2c3e50;
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            border: 1px solid #3f5568;
        }

        .settings-panel {
            background: #f8fafd;
            padding: 16px;
            border-bottom: 1px solid #d0d9e4;
            display: none;
            flex-direction: column;
            gap: 14px;
            font-size: 0.95rem;
        }

        .settings-panel.visible {
            display: flex;
        }

        .setting-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .setting-row label {
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .setting-row input {
            padding: 12px 14px;
            border: 1px solid #bdc3d0;
            border-radius: 24px;
            font-size: 1rem;
            background: white;
            outline: none;
            transition: border 0.1s;
        }

        .setting-row input:focus {
            border-color: #1e2b3c;
        }

        .api-key-note {
            font-size: 0.75rem;
            color: #6b7a8c;
            margin-top: 4px;
        }

        .chat-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .chat-actions button {
            background: white;
            border: 1px solid #bdc3d0;
            padding: 10px 16px;
            border-radius: 30px;
            font-weight: 500;
            color: #1e2b3c;
            cursor: pointer;
            flex: 1;
            font-size: 0.9rem;
        }

        .chat-actions button:active {
            background: #e6eef9;
        }

        /* messages area */
        #messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 10px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: #f5f7fa;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 90%;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message .bubble {
            padding: 12px 16px;
            border-radius: 22px;
            line-height: 1.45;
            word-wrap: break-word;
            font-size: 0.98rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .user .bubble {
            background: #1e2b3c;
            color: white;
            border-bottom-right-radius: 6px;
        }

        .assistant .bubble {
            background: white;
            color: #1e2b3c;
            border-bottom-left-radius: 6px;
            border: 1px solid #e0e5ec;
        }

        .message .sender {
            font-size: 0.75rem;
            margin-bottom: 4px;
            margin-left: 8px;
            color: #6b7a8c;
            font-weight: 500;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 16px 20px;
            background: white;
            border-radius: 30px;
            border: 1px solid #e0e5ec;
            align-self: flex-start;
            margin-top: 8px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #9aa9b9;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* input area */
        .input-area {
            background: white;
            border-top: 1px solid #d9e0e8;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #message-input {
            flex: 1;
            border: 1px solid #d0d9e4;
            border-radius: 24px;
            padding: 12px 18px;
            font-size: 1rem;
            resize: none;
            max-height: 120px;
            outline: none;
            background: #fbfdff;
            font-family: inherit;
        }

        #message-input:focus {
            border-color: #1e2b3c;
        }

        #send-button {
            background: #1e2b3c;
            border: none;
            border-radius: 40px;
            padding: 12px 22px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            transition: background 0.1s;
            min-width: 70px;
        }

        #send-button:active {
            background: #2c4056;
        }

        #send-button:disabled {
            background: #9aa9b9;
            cursor: not-allowed;
            box-shadow: none;
        }

        .error-message {
            background: #ffd9d9;
            color: #b00020;
            padding: 12px 18px;
            margin: 12px 16px 0;
            border-radius: 24px;
            font-size: 0.9rem;
            border-left: 4px solid #b00020;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="toolbar">
        <h1>📱 LM Studio · LAN</h1>
        <button class="settings-toggle" id="toggleSettings">⚙️ Settings</button>
    </div>

    <!-- settings panel (hidden by default) -->
    <div class="settings-panel" id="settingsPanel">
        <div class="setting-row">
            <label>🌐 Server URL (with port)</label>
            <input type="url" id="serverUrl" placeholder="http://192.168.1.100:1234" value="http://192.168.1.100:1234">
            <div class="api-key-note">Your LM Studio LAN address (e.g., http://192.168.1.50:1234)</div>
        </div>
        <div class="setting-row">
            <label>🤖 Model name (optional)</label>
            <input type="text" id="modelName" placeholder="local-model" value="local-model">
        </div>
        <div class="setting-row">
            <label>🔑 API Key (if required)</label>
            <input type="text" id="apiKey" placeholder="sk-... (leave blank if none)" value="">
        </div>
        <div class="chat-actions">
            <button id="newChatBtn">🔄 New conversation</button>
            <button id="testConnectionBtn">📡 Test connection</button>
        </div>
    </div>

    <!-- connection error / status indicator (hidden by default) -->
    <div id="errorBanner" style="display: none;" class="error-message">⚠️ <span id="errorText">Connection error</span></div>

    <!-- messages area -->
    <div id="messages-container"></div>

    <!-- typing indicator (hidden by default) -->
    <div id="typingIndicator" class="typing-indicator" style="display: none; margin-left: 16px; margin-bottom: 8px;">
        <span></span><span></span><span></span>
    </div>

    <!-- input row -->
    <div class="input-area">
        <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
        <button id="send-button" disabled>Send</button>
    </div>
</div>

<script>
    (function() {
        // DOM elements
        const toggleSettingsBtn = document.getElementById('toggleSettings');
        const settingsPanel = document.getElementById('settingsPanel');
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const newChatBtn = document.getElementById('newChatBtn');
        const testBtn = document.getElementById('testConnectionBtn');
        const errorBanner = document.getElementById('errorBanner');
        const errorText = document.getElementById('errorText');
        const typingIndicator = document.getElementById('typingIndicator');

        // settings inputs
        const serverUrlInput = document.getElementById('serverUrl');
        const modelNameInput = document.getElementById('modelName');
        const apiKeyInput = document.getElementById('apiKey');

        // conversation state
        let messages = [];  // array of { role, content }
        let abortController = null;  // for stopping ongoing stream

        // load any saved settings from localStorage
        function loadSettings() {
            const savedUrl = localStorage.getItem('lm_server_url');
            if (savedUrl) serverUrlInput.value = savedUrl;
            const savedModel = localStorage.getItem('lm_model');
            if (savedModel) modelNameInput.value = savedModel;
            const savedKey = localStorage.getItem('lm_api_key');
            if (savedKey) apiKeyInput.value = savedKey;
        }
        loadSettings();

        // save settings when changed (simple)
        function saveSettings() {
            localStorage.setItem('lm_server_url', serverUrlInput.value.trim());
            localStorage.setItem('lm_model', modelNameInput.value.trim());
            localStorage.setItem('lm_api_key', apiKeyInput.value.trim());
        }

        serverUrlInput.addEventListener('change', saveSettings);
        modelNameInput.addEventListener('change', saveSettings);
        apiKeyInput.addEventListener('change', saveSettings);

        // toggle settings panel
        toggleSettingsBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('visible');
        });

        // new conversation
        newChatBtn.addEventListener('click', () => {
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
            messages = [];
            renderMessages();
            hideError();
            enableSendButton(true);
        });

        // test connection (simple non-streaming call to check reachability)
        testBtn.addEventListener('click', async () => {
            const baseUrl = serverUrlInput.value.trim();
            if (!baseUrl) {
                showError('Please enter server URL');
                return;
            }
            try {
                showError(null); // hide any old error
                const testEndpoint = baseUrl.replace(/\/+$/, '') + '/v1/models';  // OpenAI compatible models endpoint
                const response = await fetch(testEndpoint, {
                    method: 'GET',
                    mode: 'cors',
                    headers: {
                        'Accept': 'application/json',
                        ...(apiKeyInput.value.trim() && { 'Authorization': `Bearer ${apiKeyInput.value.trim()}` })
                    }
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                // show quick success
                showTemporaryMessage('✅ Connection successful! Models: ' + (data.data ? data.data.map(m => m.id).join(', ') : 'n/a'));
            } catch (err) {
                showError('Connection failed: ' + err.message + ' — check URL, CORS, and ensure LM Studio is running.');
            }
        });

        // show a temporary info message in the chat area (like a system notification)
        function showTemporaryMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.style.backgroundColor = '#e0f2e0';
            msgDiv.style.padding = '10px 16px';
            msgDiv.style.borderRadius = '20px';
            msgDiv.style.margin = '8px 16px';
            msgDiv.style.alignSelf = 'center';
            msgDiv.style.fontSize = '0.9rem';
            msgDiv.style.color = '#1e4a1e';
            msgDiv.style.border = '1px solid #a5d6a5';
            msgDiv.innerText = text;
            messagesContainer.appendChild(msgDiv);
            setTimeout(() => msgDiv.remove(), 5000);
        }

        // render all messages from `messages` array
        function renderMessages() {
            messagesContainer.innerHTML = '';
            for (let msg of messages) {
                appendMessageToDOM(msg.role, msg.content);
            }
            scrollToBottom();
        }

        function appendMessageToDOM(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', role);

            const senderDiv = document.createElement('div');
            senderDiv.classList.add('sender');
            senderDiv.innerText = role === 'user' ? 'You' : 'Assistant';
            messageDiv.appendChild(senderDiv);

            const bubbleDiv = document.createElement('div');
            bubbleDiv.classList.add('bubble');
            // simple line break handling
            bubbleDiv.innerText = content;
            messageDiv.appendChild(bubbleDiv);

            messagesContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showError(msg) {
            if (msg) {
                errorText.innerText = msg;
                errorBanner.style.display = 'flex';
            } else {
                errorBanner.style.display = 'none';
            }
        }

        function hideError() { errorBanner.style.display = 'none'; }

        function enableSendButton(enable) {
            sendButton.disabled = !enable;
        }

        // handle sending message
        async function sendMessage() {
            const userText = messageInput.value.trim();
            if (!userText) return;

            // add user message to state and UI
            messages.push({ role: 'user', content: userText });
            appendMessageToDOM('user', userText);
            messageInput.value = '';
            messageInput.style.height = 'auto';
            enableSendButton(false);
            hideError();

            // show typing indicator
            typingIndicator.style.display = 'flex';
            scrollToBottom();

            // prepare for streaming
            const baseUrl = serverUrlInput.value.trim();
            const model = modelNameInput.value.trim() || 'local-model';
            const apiKey = apiKeyInput.value.trim();

            if (!baseUrl) {
                showError('Server URL is missing. Set it in settings.');
                typingIndicator.style.display = 'none';
                enableSendButton(true);
                return;
            }

            const endpoint = baseUrl.replace(/\/+$/, '') + '/v1/chat/completions';

            // Prepare request messages (including conversation history)
            const requestMessages = messages.map(m => ({ role: m.role, content: m.content }));

            const requestBody = {
                model: model,
                messages: requestMessages,
                stream: true,
                temperature: 0.7,
                max_tokens: -1,  // let LM Studio decide (or omit)
            };

            // abort previous stream if any
            if (abortController) {
                abortController.abort();
            }
            abortController = new AbortController();

            // temporary variable for accumulating assistant reply
            let assistantReply = '';
            let assistantMessageId = null; // we'll update the same DOM element

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'text/event-stream',
                        ...(apiKey && { 'Authorization': `Bearer ${apiKey}` })
                    },
                    body: JSON.stringify(requestBody),
                    signal: abortController.signal,
                    mode: 'cors', // attempt CORS
                });

                if (!response.ok) {
                    let errorDetail = '';
                    try {
                        const errBody = await response.text();
                        errorDetail = errBody.substring(0, 200);
                    } catch (e) {}
                    throw new Error(`HTTP ${response.status}: ${response.statusText} — ${errorDetail}`);
                }

                if (!response.body) throw new Error('ReadableStream not supported');

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';

                // read stream
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || ''; // keep partial line

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || trimmed === 'data: [DONE]') continue;
                        if (trimmed.startsWith('data: ')) {
                            const jsonStr = trimmed.slice(6);
                            try {
                                const parsed = JSON.parse(jsonStr);
                                const delta = parsed.choices?.[0]?.delta;
                                if (delta && delta.content) {
                                    const contentPiece = delta.content;
                                    assistantReply += contentPiece;

                                    // update UI: either create new bubble or append to existing
                                    if (assistantMessageId === null) {
                                        // first piece: create assistant message bubble
                                        const messageDiv = document.createElement('div');
                                        messageDiv.classList.add('message', 'assistant');
                                        messageDiv.setAttribute('data-msg-id', 'streaming');
                                        const senderDiv = document.createElement('div');
                                        senderDiv.classList.add('sender');
                                        senderDiv.innerText = 'Assistant';
                                        messageDiv.appendChild(senderDiv);
                                        const bubbleDiv = document.createElement('div');
                                        bubbleDiv.classList.add('bubble');
                                        bubbleDiv.innerText = contentPiece;
                                        messageDiv.appendChild(bubbleDiv);
                                        messagesContainer.appendChild(messageDiv);
                                        assistantMessageId = messageDiv;
                                    } else {
                                        // update existing bubble
                                        const bubble = assistantMessageId.querySelector('.bubble');
                                        bubble.innerText = assistantReply;
                                    }
                                    scrollToBottom();
                                }
                            } catch (e) {
                                console.warn('Failed to parse JSON:', jsonStr, e);
                            }
                        }
                    }
                }

                // after stream ends, add the full assistant message to messages array
                if (assistantReply) {
                    messages.push({ role: 'assistant', content: assistantReply });
                } else {
                    // if no content but stream finished without error: maybe empty response
                    if (assistantMessageId) {
                        assistantMessageId.remove(); // remove empty bubble
                    }
                }

                // clean up
                typingIndicator.style.display = 'none';
                enableSendButton(true);
                abortController = null;

                // if assistantMessageId exists but no content? we already handled
                // ensure scroll
                scrollToBottom();

            } catch (err) {
                if (err.name === 'AbortError') {
                    console.log('Stream aborted by user');
                    // if aborted, we might have partial message; decide to keep or discard
                    // discard partial assistant message from UI
                    if (assistantMessageId) {
                        assistantMessageId.remove();
                    }
                } else {
                    console.error(err);
                    showError('Request failed: ' + err.message);
                }
                typingIndicator.style.display = 'none';
                enableSendButton(true);
                abortController = null;
            }
        }

        // event listeners
        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendButton.disabled) sendMessage();
            }
        });

        // auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if (this.value.trim()) {
                // enable send button only if there's text AND not currently streaming
                if (!abortController) sendButton.disabled = false;
            } else {
                sendButton.disabled = true;
            }
        });

        // initial state: enable send button if input has text
        messageInput.dispatchEvent(new Event('input'));

        // optional: hide settings when clicking outside? not necessary.

        // clear error when user starts typing
        messageInput.addEventListener('focus', () => hideError());

        // graceful shutdown of ongoing request (if any) on page unload
        window.addEventListener('beforeunload', () => {
            if (abortController) abortController.abort();
        });

        // welcome message
        if (messages.length === 0) {
            // add a small info message from system
            const infoDiv = document.createElement('div');
            infoDiv.style.padding = '12px 18px';
            infoDiv.style.backgroundColor = '#e3f0ff';
            infoDiv.style.borderRadius = '28px';
            infoDiv.style.margin = '16px';
            infoDiv.style.textAlign = 'center';
            infoDiv.style.color = '#0a2a44';
            infoDiv.style.border = '1px solid #bbd6fb';
            infoDiv.innerText = '💬 Connect to LM Studio on your LAN. Set the correct IP in Settings, then start chatting.';
            messagesContainer.appendChild(infoDiv);
        }
    })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>LM Studio Mobile Chat · LAN</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
    <div class="toolbar">
        <h1>📱 LM Studio · LAN</h1>
        <button class="settings-toggle" id="toggleSettings">⚙️ Settings</button>
    </div>

    <!-- settings panel (hidden by default) -->
    <div class="settings-panel" id="settingsPanel">
        <div class="setting-row">
            <label>🌐 Server URL (with port)</label>
            <input type="url" id="serverUrl" placeholder="http://192.168.1.100:1234" value="http://192.168.1.100:1234">
            <div class="api-key-note">Your LM Studio LAN address (e.g., http://192.168.1.50:1234)</div>
        </div>
        <div class="setting-row">
            <label>🤖 Model name (optional)</label>
            <input type="text" id="modelName" placeholder="local-model" value="local-model">
        </div>
        <div class="setting-row">
            <label>🔑 API Key (if required)</label>
            <input type="text" id="apiKey" placeholder="sk-... (leave blank if none)" value="">
        </div>
        <div class="chat-actions">
            <button id="newChatBtn">🔄 New conversation</button>
            <button id="testConnectionBtn">📡 Test connection</button>
        </div>
    </div>

    <!-- connection error / status indicator (hidden by default) -->
    <div id="errorBanner" style="display: none;" class="error-message">⚠️ <span id="errorText">Connection error</span></div>

    <!-- messages area -->
    <div id="messages-container"></div>

    <!-- typing indicator (hidden by default) -->
    <div id="typingIndicator" class="typing-indicator" style="display: none; margin-left: 16px; margin-bottom: 8px;">
        <span></span><span></span><span></span>
    </div>

    <!-- input row -->
    <div class="input-area">
        <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
        <button id="send-button" disabled>Send</button>
    </div>
</div>
<script src="scripts.js"></script>
</body>
</html>
